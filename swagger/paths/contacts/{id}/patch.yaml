tags:
  - Contacts
summary: Edit contact by id
operationId: editContact
description: 'Edit contact by id'
security:
  - bearerAuth: []
parameters:
  - in: path
    name: id
    required: true
    schema:
      type: string
      example: '65ca67e7ae7f10c88b598384'
requestBody:
  content:
    multipart/form-data:
      schema:
        type: object
        properties:
          name:
            description: "Contact's name"
            type: string
            example: 'John Doe'
          phoneNumber:
            description: 'Phone number'
            type: string
            example: '+380-12-345-6789'
          contactType:
            description: 'Contact type'
            type: string
            enum: ['work', 'home', 'personal']
          email:
            description: 'Contact email address'
            type: string
            example: JohnDoe@mail.com
          isFavourite:
            description: 'Is contact favorite'
            type: boolean
            example: false
          userId:
            description: 'Contact id'
            type: string
            example: 65e4decdd286b30065d54af9
          photo:
            description: "Link to contact's photo"
            type: string
            format: binary
responses:
  '201':
    description: 'Updated contact by id'
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 201
            message:
              type: string
              example: Successfully created a contact!
            data:
              type: object
              $ref: '../../../components/schemas/contact.yaml'
  '404':
    $ref: '../../../components/responses/404.yaml'
  '401':
    $ref: '../../../components/responses/401.yaml'
